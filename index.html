<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SeedForge</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1a1a">
    <style>
        body {
            margin: 0;
            background-color: #1a1a1a;
            color: #eee;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        #controls {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #2a2a2a;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            z-index: 10;
        }
        .control-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        input[type="text"] {
            flex-grow: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #1a1a1a;
            color: white;
            font-size: 16px;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #4CAF50;
        }
        button {
            padding: 12px 20px;
            border-radius: 8px;
            border: none;
            background-color: #4CAF50;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:active {
            background-color: #3e8e41;
        }
        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }
        input[type="range"] {
            flex-grow: 1;
            accent-color: #4CAF50;
        }
        #canvas-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
            overflow: hidden;
            position: relative;
        }
        canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div id="controls">
        <div class="control-row">
            <input type="text" id="seed-input" value="wyspa-42" placeholder="Wpisz seed...">
            <button id="generate-btn">Generuj</button>
        </div>
        <div class="slider-container">
            <label for="sea-level">Poziom morza:</label>
            <input type="range" id="sea-level" min="10" max="80" value="45">
            <span id="sea-level-val">45%</span>
        </div>
    </div>

    <div id="canvas-container">
        <canvas id="map-canvas"></canvas>
    </div>

    <script>
        // --- 1. SILNIK LOSUJĄCY (RNG) ---
        function createRng(seedString) {
            let h = 1779033703 ^ seedString.length;
            for (let i = 0; i < seedString.length; i++) {
                h = Math.imul(h ^ seedString.charCodeAt(i), 3432918353);
                h = h << 13 | h >>> 19;
            }
            let a = h >>> 0;
            return function() {
                a |= 0; a = a + 0x6D2B79F5 | 0;
                let t = Math.imul(a ^ a >>> 15, 1 | a);
                t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            }
        }

        // --- 2. GENERATOR SZUMU (z parametrem gęstości) ---
        function generateNoise(width, height, rng, gridSize) {
            const gridW = Math.ceil(width / gridSize) + 1;
            const gridH = Math.ceil(height / gridSize) + 1;
            
            const grid = [];
            for (let y = 0; y < gridH; y++) {
                const row = [];
                for (let x = 0; x < gridW; x++) {
                    row.push(rng());
                }
                grid.push(row);
            }

            const imageData = new Float32Array(width * height);
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const gx = x / gridSize;
                    const gy = y / gridSize;
                    
                    const x0 = Math.floor(gx);
                    const y0 = Math.floor(gy);
                    const x1 = x0 + 1;
                    const y1 = y0 + 1;
                    
                    const tx = gx - x0;
                    const ty = gy - y0;
                    
                    const sx = tx * tx * (3 - 2 * tx);
                    const sy = ty * ty * (3 - 2 * ty);
                    
                    const top = grid[y0][x0] * (1 - sx) + grid[y0][x1] * sx;
                    const bottom = grid[y1][x0] * (1 - sx) + grid[y1][x1] * sx;
                    
                    imageData[y * width + x] = top * (1 - sy) + bottom * sy;
                }
            }
            return imageData;
        }

        // --- 3. FBM (Fractal Brownian Motion) ---
        // Nakłada na siebie kilka warstw szumu (duże góry, pagórki, detale)
        function generateFBM(width, height, rng) {
            let result = new Float32Array(width * height);
            let amplitude = 1;
            let frequency = 1;
            let maxAmplitude = 0;

            // 5 warstw (oktaw)
            for (let i = 0; i < 5; i++) {
                const gridSize = 150 / frequency;
                const noise = generateNoise(width, height, rng, gridSize);
                
                for (let j = 0; j < width * height; j++) {
                    result[j] += noise[j] * amplitude;
                }
                
                maxAmplitude += amplitude;
                amplitude *= 0.5;
                frequency *= 2;
            }

            // Normalizacja (żeby wartości były od 0 do 1)
            for (let j = 0; j < width * height; j++) {
                result[j] /= maxAmplitude;
            }
            return result;
        }

        // --- 4. GŁÓWNA FUNKCJA GENERUJĄCA MAPĘ ---
        function generateMap() {
            const seed = document.getElementById('seed-input').value;
            const seaLevel = parseInt(document.getElementById('sea-level').value) / 100;
            
            // Używamy osobnych RNG dla terenu i dla wybrzeża, żeby na siebie nie wpływały
            const rngTerrain = createRng(seed + "_terrain");
            const rngCoast = createRng(seed + "_coast");
            
            const canvas = document.getElementById('map-canvas');
            const ctx = canvas.getContext('2d');
            
            const size = 512;
            canvas.width = size;
            canvas.height = size;

            // Generujemy główny teren
            const rawHeights = generateFBM(size, size, rngTerrain);
            
            // Generujemy szum dla wybrzeża (kształt wyspy)
            const coastNoise = generateNoise(size, size, rngCoast, 100);

            const finalHeights = new Float32Array(size * size);

            const center = size / 2;
            const maxDist = size / 2;

            // Nakładanie maski wyspy (teraz poszarpanej)
            for (let y = 0; y < size; y++) {
                for (let x = 0; x < size; x++) {
                    const i = y * size + x;
                    
                    const dx = (x - center) / maxDist;
                    const dy = (y - center) / maxDist;
                    
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    
                    // Zaburzamy odległość za pomocą szumu (wybrzeże robi się nieregularne)
                    dist += (coastNoise[i] - 0.5) * 0.3;
                    
                    // Maska (im dalej od środka, tym niżej)
                    let mask = 1.0 - dist * dist * 1.5;
                    if (mask < 0) mask = 0;
                    if (mask > 1) mask = 1;

                    // Podnosimy teren w środku i łączymy z maską
                    finalHeights[i] = (rawHeights[i] * 0.8 + 0.2) * mask;
                }
            }

            const imgData = ctx.createImageData(size, size);

            // Wektor światła
            const lightX = -1;
            const lightY = -1;
            const lightZ = 1.5;
            const lightLength = Math.sqrt(lightX*lightX + lightY*lightY + lightZ*lightZ);
            const lx = lightX / lightLength;
            const ly = lightY / lightLength;
            const lz = lightZ / lightLength;

            for (let y = 0; y < size; y++) {
                for (let x = 0; x < size; x++) {
                    const i = y * size + x;
                    const h = finalHeights[i];

                    let r, g, b;

                    // KOLOROWANIE
                    if (h < seaLevel) {
                        // Woda
                        const depth = (seaLevel - h) / seaLevel;
                        r = 20; 
                        g = 50 + (1 - depth) * 100; 
                        b = 100 + (1 - depth) * 155;
                    } else if (h < seaLevel + 0.03) {
                        // Piasek
                        r = 220; g = 200; b = 150;
                    } else if (h < 0.7) {
                        // Trawa
                        const greenIntensity = (h - seaLevel) / (0.7 - seaLevel);
                        r = 34 + (1 - greenIntensity) * 40; 
                        g = 139 - greenIntensity * 30; 
                        b = 34;
                    } else if (h < 0.85) {
                        // Skały
                        r = 120; g = 120; b = 120;
                    } else {
                        // Śnieg
                        r = 255; g = 255; b = 255;
                    }

                    // CIENIOWANIE (Hillshade)
                    let hL = h;
                    let hU = h;
                    if (x > 0) hL = finalHeights[i - 1];
                    if (y > 0) hU = finalHeights[i - size];

                    const dx = (hL - h) * 300; // Zwiększony współczynnik = wyraźniejszy cień
                    const dy = (hU - h) * 300;

                    const nx = -dx;
                    const ny = -dy;
                    const nz = 1.0;
                    const nLength = Math.sqrt(nx*nx + ny*ny + nz*nz);

                    let shade = (nx/nLength * lx) + (ny/nLength * ly) + (nz/nLength * lz);
                    
                    if (h < seaLevel) {
                        shade = 0.9 + shade * 0.1; 
                    }

                    r = Math.max(0, Math.min(255, r * shade));
                    g = Math.max(0, Math.min(255, g * shade));
                    b = Math.max(0, Math.min(255, b * shade));

                    const p = i * 4;
                    imgData.data[p] = r;
                    imgData.data[p + 1] = g;
                    imgData.data[p + 2] = b;
                    imgData.data[p + 3] = 255;
                }
            }

            ctx.putImageData(imgData, 0, 0);
        }

        // --- 5. OBSŁUGA ZDARZEŃ ---
        document.getElementById('generate-btn').addEventListener('click', generateMap);

        const seaSlider = document.getElementById('sea-level');
        const seaValDisplay = document.getElementById('sea-level-val');
        
        seaSlider.addEventListener('input', (e) => {
            seaValDisplay.textContent = e.target.value + '%';
            generateMap();
        });

        generateMap();

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => {
                console.log('Błąd rejestracji SW:', err);
            });
        }
    </script>
</body>
</html>
